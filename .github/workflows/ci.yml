name: CI

# 门禁：Bun 工具脚本、Rust workspace（Linux）、SwiftUI 客户端（macOS）。
#
# 一次 push 只跑一套：
# - 客户端改动（release.yml 的触发路径）合入 main 时由 Release 工作流以 workflow_call 调用这一整套，
#   所以 push 这里排除同一组路径，免得同一次合入跑两遍；
# - 只改文档、官网（site.yml 管）时不跑；其余（工具脚本、根配置、Tests、本文件）由这里跑。
# 改 release.yml 的 paths 时同步改下面 push 的 paths-ignore。
# pull_request 不加文档类路径过滤：路径过滤会让被跳过的检查一直挂起，PR 合不进来。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'docs/**'
      - '**.md'
      # 以下与 release.yml 的 paths 一致（Release 会调用本工作流）
      - 'apps/macos/.gitignore'
      - 'apps/macos/Package.swift'
      - 'apps/macos/Package.resolved'
      - 'apps/macos/Sources/**'
      - 'apps/macos/packaging/**'
      - 'apps/macos/scripts/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/sparkle-appcast.ts'
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  # 手动对任意分支跑一遍（推送功能分支不会自动触发）
  workflow_dispatch:
  # Release 工作流先调用这一整套门禁，全部通过才构建与发布
  workflow_call:

# 只有 PR 的新推送取消同一 PR 上还在跑的旧检查；main 的每次 push 都跑完。
# 被 Release 以 workflow_call 调用时 github.workflow 是 "Release"、event_name 是 push：
# 组名与 push 触发的 CI 不同，也不会取消，Release 的门禁不会被别的运行打断。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling (lint / types / tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # 与 package.json 的 packageManager 一致，本地与 CI 用同一个 bun
          bun-version-file: package.json

      - name: Install dependencies
        # lockfile 与 package.json 不一致时直接失败，而不是悄悄改锁文件
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Tooling tests
        run: bun run test:tools

  # 整个 Rust workspace 在 Linux 上检查与测试：umuo-core / umuo-app 必须不依赖平台，
  # 谁不小心引入 AppKit 一类依赖就在这里红；umuo-ffi、umuo-store 也在 Linux 上编得过、测得了。
  # 工具链版本由 rust-toolchain.toml 固定，本机与 CI 的 rustfmt / clippy 一致。
  rust:
    name: Rust (fmt / clippy / tests, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  macos-app:
    # SwiftUI 客户端（apps/macos）：与本机 bun run verify:macos 同一个脚本（verify.sh），
    # 编内核与绑定 → swift build → Swift Testing → --selftest（从 Swift 逐项调用 Rust 内核）→ 打包冒烟。
    name: macOS app (SwiftUI + umuo-core)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26
        run: sh .github/scripts/select-xcode.sh

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: verify:macos
        run: sh apps/macos/scripts/verify.sh
