name: CI

# 两条门禁：TS 侧（客户端 UI）与 Rust 侧（翻译内核 + 平台适配）。
# 客户端只承诺 macOS，所以 Rust 作业跑在 macOS runner 上——否则编译不了平台适配层。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Desktop UI (lint / types / tests / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 不写死小版本：仓库要求 bun >=1.2，写死一个本地版本在 CI 上可能并不存在
          bun-version: latest

      - name: Install dependencies
        # lockfile 与 package.json 不一致时直接失败，而不是悄悄改锁文件
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Tests (Vitest)
        run: bun run test:run

      - name: Build desktop UI
        run: bun run build:desktop-ui

  rust:
    name: Rust (fmt / clippy / tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
