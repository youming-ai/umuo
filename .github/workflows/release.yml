name: Release

# 手动构建 SwiftUI 通用安装包，不上传 R2。正式发布前的更新与签名要求见 docs/SWIFTUI-MIGRATION.md。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 原生客户端版本（X.Y.Z）
        required: true
        type: string

# 手动重复运行时取消前一次构建。
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # 门禁与 PR 使用同一套 CI（ci.yml），全部通过才生成安装包。
  ci:
    uses: ./.github/workflows/ci.yml

  macos:
    name: Build macOS artifacts
    needs: ci
    runs-on: macos-15  # macos-14 镜像 2026-11-02 退役（actions/runner-images#13518）
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-universal

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and stamp version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          sed -i '' -E '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml

      - name: Build universal native app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: sh apps/macos/scripts/bundle.sh --version "$VERSION"

      - name: Sign Sparkle update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          sparkle_key=$(mktemp)
          trap 'rm -f "$sparkle_key"' EXIT
          chmod 600 "$sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key"
          SPARKLE_PRIVATE_KEY_PATH="$sparkle_key" bun scripts/sparkle-appcast.ts "$PWD/apps/macos/dist" "$VERSION"

      - name: Keep native release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umuo-${{ env.VERSION }}-universal
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/*.app.tar.gz
            apps/macos/dist/appcast.xml
          retention-days: 14
