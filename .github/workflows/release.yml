name: Release

# 客户端改动合入 main 时自动构建 Apple Silicon（arm64）安装包并发布到 GitHub Releases
# （正式版并标为 Latest；固定自签名证书签名，尚未经 Apple 公证）。
# 版本号 = Cargo.toml 的主.次版本 + 本工作流的运行序号（如 0.2.12）；手动运行（workflow_dispatch）时可指定版本。
# 附件：umuo-v<版本>.dmg（安装包，带版本号；官网 /download/macos 由 Worker 查最新 tag 后跳过去）、
# umuo.app.tar.gz 与 appcast.xml（名字固定；Sparkle 的 SUFeedURL 指向 releases/latest/download/appcast.xml），发布即上线。签名、密钥与失败后的清理见 docs/SWIFTUI-MIGRATION.md。
on:
  push:
    branches: [main]
    # 改这里时同步改 ci.yml 里 push 的 paths-ignore（这些改动的门禁由本工作流调用 CI 完成）
    paths:
      - 'apps/macos/**'
      - '!apps/macos/Tests/**'
      # 只认进二进制的部分：crates/*/tests 与文档只跑 CI，不给全体用户推一次零改动的更新
      - 'crates/*/src/**'
      - 'crates/*/Cargo.toml'
      - 'crates/umuo-ffi/uniffi-bindgen.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/sparkle-appcast.ts'
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
      - '!**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 原生客户端版本（X.Y.Z；留空则按 Cargo.toml 主.次版本 + 运行序号）
        required: false
        type: string

# 同一时间只发一个版本，不取消正在跑的那次。注意 GitHub 的并发组最多只留一个排队中的运行：
# 前一次还在跑时又合入两次，先排队的那次会被后来的顶掉（显示为 cancelled），只有最新一次出包。
# 中间那次的改动已包含在最新一次里，不需要补发。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 门禁与 PR 使用同一套 CI（ci.yml），全部通过才生成安装包。
  ci:
    uses: ./.github/workflows/ci.yml

  macos:
    name: Build macOS artifacts (arm64)
    needs: ci
    # 只从 main 发：手动运行选了别的分支时不出包，免得没合入的代码被标成 Latest 经 Sparkle 推给所有人
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15  # Apple Silicon runner：宿主即 aarch64-apple-darwin
    timeout-minutes: 60
    # 只有这个 job 需要写：创建 tag 与 Release、上传附件
    permissions:
      contents: write
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 本 job 有 contents: write；不把 token 留在 .git/config 里给后面的依赖构建脚本读到。
          # 发布用的 gh 单独传 GH_TOKEN，git ls-remote 查的是公开仓库，都不需要它
          persist-credentials: false

      - name: Select Xcode 26
        run: sh .github/scripts/select-xcode.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-arm64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and stamp version
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            base=$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "([0-9]+\.[0-9]+)\..*"/\1/p' Cargo.toml)
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          # Release（含草稿）与 tag 任一已存在都不发：上次失败可能只留下其中之一，清理步骤见 docs/SWIFTUI-MIGRATION.md
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version 已存在" >&2; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then echo "tag v$version 已存在" >&2; exit 1; fi
          # 新版本必须高于当前 Latest：手动填了更低的版本号会被标成 Latest，官网下载与 Sparkle 跟着回退
          latest=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "版本 $version 不高于当前 Latest $latest" >&2; exit 1
          fi
          sed -i '' -E '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$version"'"/' Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      # 所有版本复用同一张自签名证书；不能在 runner 上临时生成，否则升级时身份会变化。
      - name: Import umuo signing identity
        env:
          UMUO_SIGNING_P12_BASE64: ${{ secrets.UMUO_SIGNING_P12_BASE64 }}
          UMUO_SIGNING_P12_PASSWORD: ${{ secrets.UMUO_SIGNING_P12_PASSWORD }}
        run: sh .github/scripts/import-signing-identity.sh

      - name: Build native app (arm64)
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: sh apps/macos/scripts/bundle.sh --version "$VERSION"

      - name: Delete signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/umuo-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

      - name: Sign Sparkle update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          sparkle_key=$(mktemp)
          trap 'rm -f "$sparkle_key"' EXIT
          chmod 600 "$sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key"
          SPARKLE_PRIVATE_KEY_PATH="$sparkle_key" bun scripts/sparkle-appcast.ts "$PWD/apps/macos/dist" "$VERSION"

      - name: Keep native release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umuo-${{ env.VERSION }}-arm64
          path: |
            apps/macos/dist/umuo-v${{ env.VERSION }}.dmg
            apps/macos/dist/umuo.app.tar.gz
            apps/macos/dist/appcast.xml
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 更新说明从上一个 Release 起算；第一次发布没有上一个，就让 GitHub 从头生成。
          # 正式版并标 Latest：releases/latest/download/<文件名> 才会指向这一版（预发布不算 latest）
          # 排除草稿与预发布：残留的草稿（tag 往往还不存在）会被排在最前，拿它当 --notes-start-tag 会让这一步失败
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          notes=$(mktemp)
          # 不加引号的 EOF：$VERSION 要展开；反引号转义，免得被当成命令替换
          cat >"$notes" <<EOF
          > 本版本尚未经 Apple 公证。首次打开时 macOS 会拦下：请到「系统设置 › 隐私与安全性」底部点「仍要打开」放行，之后正常启动。
          >
          > 下载 \`umuo-v$VERSION.dmg\`（Apple Silicon（arm64），macOS 14+），拖进「应用程序」即可；已安装的版本可在「设置 › 关于」里检查更新并升级。
          EOF
          set -- --target "$GITHUB_SHA" --latest --generate-notes --notes-file "$notes" --title "umuo $VERSION"
          [ -n "$previous" ] && set -- "$@" --notes-start-tag "$previous"
          gh release create "v$VERSION" "$@" \
            "apps/macos/dist/umuo-v$VERSION.dmg" apps/macos/dist/umuo.app.tar.gz apps/macos/dist/appcast.xml
