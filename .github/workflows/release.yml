name: Release

# 客户端改动合入 main 时自动构建通用安装包并发布到 GitHub Releases（预发布：未经 Apple 公证）。
# 版本号 = Cargo.toml 的主.次版本 + 本工作流的运行序号（如 0.1.12）；手动运行时可指定版本。
# 只发 GitHub Releases，不上传 R2、不改官网下载。签名与更新要求见 docs/SWIFTUI-MIGRATION.md。
on:
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 原生客户端版本（X.Y.Z；留空则按 Cargo.toml 主.次版本 + 运行序号）
        required: false
        type: string

# 依次发布，不互相取消：每次合入都要有自己的包。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 门禁与 PR 使用同一套 CI（ci.yml），全部通过才生成安装包。
  ci:
    uses: ./.github/workflows/ci.yml

  macos:
    name: Build macOS artifacts
    needs: ci
    runs-on: macos-15  # macos-14 镜像 2026-11-02 退役（actions/runner-images#13518）
    timeout-minutes: 60
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 浮窗用 macOS 26 的 Liquid Glass（glassEffect），要 Xcode 26 的 SDK；镜像默认的 Xcode 16 编不过。
      # 选镜像上装好的最新 Xcode 26，找不到就直接失败，免得悄悄退回旧 SDK。
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "runner 上没有 Xcode 26" >&2; ls -d /Applications/Xcode*.app >&2; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-universal

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and stamp version
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            base=$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "([0-9]+\.[0-9]+)\..*"/\1/p' Cargo.toml)
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if gh release view "v$version" >/dev/null 2>&1; then echo "v$version 已存在" >&2; exit 1; fi
          sed -i '' -E '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$version"'"/' Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build universal native app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: sh apps/macos/scripts/bundle.sh --version "$VERSION"

      - name: Sign Sparkle update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          sparkle_key=$(mktemp)
          trap 'rm -f "$sparkle_key"' EXIT
          chmod 600 "$sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key"
          SPARKLE_PRIVATE_KEY_PATH="$sparkle_key" bun scripts/sparkle-appcast.ts "$PWD/apps/macos/dist" "$VERSION"

      - name: Keep native release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umuo-${{ env.VERSION }}-universal
          path: |
            apps/macos/dist/*.dmg
            apps/macos/dist/*.app.tar.gz
            apps/macos/dist/appcast.xml
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 更新说明从上一个 Release 起算；第一次发布没有上一个，就让 GitHub 从头生成
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          set -- --target "$GITHUB_SHA" --prerelease --generate-notes --title "umuo $VERSION"
          [ -n "$previous" ] && set -- "$@" --notes-start-tag "$previous"
          gh release create "v$VERSION" "$@" \
            apps/macos/dist/*.dmg apps/macos/dist/*.app.tar.gz apps/macos/dist/appcast.xml
