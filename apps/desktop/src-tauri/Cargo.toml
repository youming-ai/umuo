[package]
name = "umuo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "umuo 桌面客户端外壳：托盘、全局快捷键、浮窗、IPC 命令"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：常驻菜单栏（PRD §7）
# image-png：托盘用我们生成的 PNG 模板图
# macos-private-api：透明浮窗需要
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# 自动更新：读 umuo.app 上的更新清单，验 minisign 签名后替换 .app（见 src/updater.rs）
tauri-plugin-updater = "2"

serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

umuo-core = { path = "../../../crates/umuo-core" }
umuo-app = { path = "../../../crates/umuo-app" }
umuo-store = { path = "../../../crates/umuo-store" }
umuo-platform = { path = "../../../crates/umuo-platform" }
umuo-platform-macos = { path = "../../../crates/umuo-platform-macos" }

[dev-dependencies]
# 端到端测试的本地 SSE 桩（`src/pipeline_tests.rs`）。tokio 本来就在依赖树里，只多开两个 feature。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
