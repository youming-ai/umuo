# Template: AI-curated news desk on Cloudflare Workers + D1 + KV.
# 1) bun install  2) cp .dev.vars.example .dev.vars  3) wrangler kv namespace create CACHE && wrangler d1 create <db>  4) fill ids below  5) bun run deploy
name = "news-desk-template"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
main = "./worker/entrypoint.ts"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CACHE"
# TODO(template): create with `wrangler kv namespace create CACHE` and paste id
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[[d1_databases]]
binding = "DB"
database_name = "news-desk-content"
# TODO(template): create with `wrangler d1 create news-desk-content` and paste id
# Primary region defaults to where you create it; D1 cannot be moved without recreating.
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
migrations_dir = "migrations"

# No durable_objects/migrations here on purpose: the queue consumer calls
# processArticle directly. A pending DO migration cannot be applied by
# `wrangler versions upload`, which is what Workers Builds runs for preview
# branches — so a Durable Object here breaks every PR build.
#
# Two schedules, told apart by controller.cron in worker/entrypoint.ts:
# */15 ingests, 17 3 sweeps. The daily string is duplicated in PRUNE_CRON
# (src/feeds/retention.ts) because the Worker cannot read this file at
# runtime; retention.cron.test.ts asserts the two stay identical.
[triggers]
crons = ["*/15 * * * *", "17 3 * * *"]

[vars]
LLM_BASE_URL = "https://api.b.ai/v1"
LLM_MODEL = "deepseek-v4-flash"
