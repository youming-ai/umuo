# Static SPA + a Worker that edge-caches the upstream data APIs in KV.
name = "umuo"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
main = "./worker/entrypoint.ts"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CACHE"
id = "b5d6927aea7345efaddf56bcc2878e89"

[[d1_databases]]
binding = "DB"
database_name = "umuo-content"
# Required for remote deploys — database_name alone does not resolve.
# Primary region is APAC; D1 cannot be moved without recreating it.
database_id = "3d229c09-2965-4dbd-a17d-b4e43b15c86d"
migrations_dir = "migrations"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "umuo-news-ingest"

[[queues.consumers]]
queue = "umuo-news-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "umuo-news-ingest-dlq"

# No durable_objects/migrations here on purpose: the queue consumer calls
# processArticle directly. A pending DO migration cannot be applied by
# `wrangler versions upload`, which is what Workers Builds runs for preview
# branches — so a Durable Object here breaks every PR build.
#
# Two schedules, told apart by controller.cron in worker/entrypoint.ts:
# */15 ingests, 17 3 sweeps. The daily string is duplicated in PRUNE_CRON
# (src/feeds/retention.ts) because the Worker cannot read this file at
# runtime; retention.cron.test.ts asserts the two stay identical.
[triggers]
crons = ["*/15 * * * *", "17 3 * * *"]

[vars]
LLM_BASE_URL = "https://api.z.ai/api/paas/v4"
