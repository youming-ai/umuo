[package]
name = "umuo-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "umuo 的 macOS 平台适配：辅助功能取词、剪贴板、Keychain、屏幕捕获与 OCR"

# 依赖全部按目标平台声明：这个 crate 在非 macOS 上会退化成一个空 lib（编译通过、
# 无能力实现），这样 `cargo check --workspace` 不至于因为平台依赖而在别处失败。
[target.'cfg(target_os = "macos")'.dependencies]
umuo-platform = { path = "../umuo-platform" }
core-foundation = "0.10"
core-graphics = "0.24"
# foreign-types：从 core-graphics 的 CGImage 取底层指针交给 Vision。
foreign-types = "0.5"
arboard = "3"
# 三端同一套 API，靠 feature 切换后端：apple-native / windows-native /
# sync-secret-service。V1.1 接 Windows 时不需要改调用点。
keyring = { version = "3", features = ["apple-native"] }
# Vision（本机 OCR）与它需要的 Objective-C 运行时。
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-vision = "0.3"
# 解码 `screencapture` 写出的 PNG。纯 Rust，无系统依赖；
# 换成自研解码器意味着要自己处理 zlib、滤波器与调色板——那是另一件容易出错的事。
png = "0.17"
