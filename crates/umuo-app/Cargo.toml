[package]
name = "umuo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "umuo 客户端的应用层：设置、历史、请求登记、翻译流水线与语音后处理。平台无关，经 umuo-ffi 给 SwiftUI 客户端调用"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 只用 `reqwest::Url` 校验端点地址；umuo-core 本来就依赖它，不多编译任何东西
reqwest.workspace = true
umuo-core = { path = "../umuo-core" }
umuo-store = { path = "../umuo-store" }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
