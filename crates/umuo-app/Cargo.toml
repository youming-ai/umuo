[package]
name = "umuo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "umuo 客户端的应用层：设置、术语表、统计、请求登记、翻译流水线与多模型对比。不依赖 Tauri，Tauri 外壳与 SwiftUI 客户端（经 umuo-ffi）共用"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 只用 `reqwest::Url` 校验端点地址；umuo-core 本来就依赖它，不多编译任何东西
reqwest.workspace = true
# 对比的 N 路在同一个 future 里并发（`join_all`）；umuo-core 本来就依赖它
futures-util.workspace = true
umuo-core = { path = "../umuo-core" }
umuo-store = { path = "../umuo-store" }
